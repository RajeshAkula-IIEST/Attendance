<!DOCTYPE html>
<html>
<head>
  <title>Attendance</title>
  <style>
    body { font-family: Arial; }
    .student {
      padding: 10px;
      margin: 5px;
      border: 1px solid #333;
      border-radius: 5px;
      cursor: pointer;
      display: inline-block;
      width: 200px;
      text-align: center;
    }
    .present {
      background: green;
      color: white;
    }
  </style>
</head>
<body>

<h2>Attendance</h2>
<div id="students">Loading...</div>
<br>
<button onclick="submitAttendance()">Submit</button>

<script>
const URL = "https://script.google.com/a/macros/faculty.iiests.ac.in/s/AKfycbw-ax4aRLmc2h14rnTEuGJXkEBKytULLgrsXQmw6Yz9aC5HUzfrG0Z_8K5tUQKGg9qayg/exec";
let students = [];

fetch(URL)
  .then(res => res.json())
  .then(data => {
    students = data.map(s => ({ ...s, present: false }));
    render();
  });

function render() {
  const c = document.getElementById("students");
  c.innerHTML = "";
  students.forEach((s, i) => {
    const d = document.createElement("div");
    d.className = "student";
    d.innerHTML = `${s.roll}<br>${s.name}`;
    d.onclick = () => {
      students[i].present = !students[i].present;
      d.classList.toggle("present");
    };
    c.appendChild(d);
  });
}

function submitAttendance() {
  fetch(URL, {
    method: "POST",
    body: JSON.stringify(
      students.map(s => ({
        roll: s.roll,
        name: s.name,
        status: s.present ? "Present" : "Absent"
      }))
    )
  })
  .then(r => r.text())
  .then(() => alert("Attendance saved"));
}
</script>

</body>
</html>
