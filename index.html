<!DOCTYPE html>
<html>
<head>
  <title>Faculty Login | Energy Storage Technology</title>

  <style>
    /* ---------- GLOBAL ---------- */
    body {
      margin: 0;
      height: 100vh;
      font-family: "Inter", "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #0b3c5d, #1b7f79);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ---------- LOGIN CARD ---------- */
    .login-card {
      background: #ffffff;
      width: 360px;
      border-radius: 14px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.25);
      overflow: hidden;
    }

    /* ---------- HEADER ---------- */
    .login-header {
      background: #0b3c5d;
      color: #ffffff;
      text-align: center;
      padding: 18px 12px;
    }

    .login-header h2 {
      margin: 0;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.4px;
    }

    /* ---------- BODY ---------- */
    .login-body {
      padding: 26px 22px 22px;
      text-align: center;
    }

    .course-title {
      font-size: 16px;
      font-weight: 600;
      color: #263238;
      margin-bottom: 4px;
    }

    .course-code {
      font-size: 14px;
      color: #607d8b;
      margin-bottom: 20px;
    }

    input {
      width: 88%;
      padding: 11px 12px;
      margin: 10px auto 0;
      display: block;
      border-radius: 7px;
      border: 1.8px solid #f57c00;
      font-size: 14.5px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: #ef6c00;
      box-shadow: 0 0 6px rgba(245,124,0,0.45);
    }

    button {
      width: 88%;
      margin: 18px auto 0;
      display: block;
      padding: 11px;
      background: #1b7f79;
      border: none;
      color: white;
      font-size: 15.5px;
      font-weight: 600;
      border-radius: 7px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover {
      background: #166d67;
      transform: translateY(-1px);
    }

    .msg {
      margin-top: 12px;
      color: #d32f2f;
      font-size: 13px;
      min-height: 16px;
    }

    /* ---------- FOOTER ---------- */
    .login-footer {
      background: #f3f6f9;
      text-align: center;
      padding: 12px 10px;
      border-top: 1px solid #d0d7de;
    }

    .login-footer strong {
      display: block;
      font-size: 13.5px;
      color: #0b3c5d;
      font-weight: 600;
    }

    .login-footer span {
      font-size: 12px;
      color: #546e7a;
      line-height: 1.4;
    }
  </style>
</head>

<body>

<div class="login-card">

  <div class="login-header">
    <h2>Faculty Login</h2>
  </div>

  <div class="login-body">
    <div class="course-title">Energy Storage Technology</div>
    <div class="course-code">(ME4261)</div>

    <input type="password" id="pwd" placeholder="Enter password">
    <button onclick="login()">Login</button>

    <div class="msg" id="msg"></div>
  </div>

  <div class="login-footer">
    <strong>Developed by Dr. Rajesh Akula</strong><br>
    <span> © 2026 · IIEST Shibpur    </span>
  </div>

</div>

<script>
const PASSWORD = "Raj9484";

function login() {
  if (document.getElementById("pwd").value === PASSWORD) {
    sessionStorage.setItem("loggedIn", "yes");
    window.location.href = "attendance.html";
  } else {
    document.getElementById("msg").innerText = "Invalid password";
  }
}
</script>

</body>
</html>
