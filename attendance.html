<!DOCTYPE html>
<html>
<head>
  <title>Attendance</title>

  <script>
    if (sessionStorage.getItem("loggedIn") !== "yes") {
      window.location.href = "index.html";
    }
  </script>

  <style>
    body { font-family: Arial; }

    .student {
      border: 1px solid #333;
      width: 260px;
      margin: 6px;
      border-radius: 6px;
      overflow: hidden;
      display: inline-block;
    }

    .info {
      text-align: center;
      padding: 6px;
      font-weight: bold;
    }

    .stats {
      text-align: center;
      font-size: 12px;
      background: #f4f4f4;
      padding: 4px;
    }

    .row { display: flex; }

    .btn {
      flex: 1;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      border-top: 1px solid #333;
    }

    .present { background: #4CAF50; color: white; }
    .absent { background: #F44336; color: white; }
  </style>
</head>

<body>

<h2>Attendance (Live Update)</h2>
<div id="students">Loading...</div>

<script>
const URL = "https://script.google.com/macros/s/AKfycby8r8kA6O6u69YIEtWCE-DowvMNZ2TGlh-4Otz2-em5aG7AP8f1rPxF61lWg9NOLzMq/exec";
let students = [];

Promise.all([
  fetch(URL).then(r => r.json()),
  fetch(URL + "?stats=true").then(r => r.json())
]).then(([list, stats]) => {

  const map = {};
  stats.forEach(s => map[s.roll] = s);

  students = list.map(s => ({
    ...s,
    attended: map[s.roll]?.attended || 0,
    total: map[s.roll]?.total || 0
  }));

  render();
});

function render() {
  const c = document.getElementById("students");
  c.innerHTML = "";

  students.forEach((s, i) => {
    const d = document.createElement("div");
    d.className = "student";
    d.innerHTML = `
      <div class="info">${s.roll}<br>${s.name}</div>
      <div class="stats" id="stats-${i}">
        ${s.attended}/${s.total}
        (${s.total ? ((s.attended/s.total)*100).toFixed(1) : 0}%)
      </div>
      <div class="row">
        <div class="btn" onclick="mark(${i},'Present',this)">Present</div>
        <div class="btn" onclick="mark(${i},'Absent',this)">Absent</div>
      </div>`;
    c.appendChild(d);
  });
}

function mark(i, status, el) {
  const s = students[i];

  const row = el.parentElement;
  row.children[0].className = "btn";
  row.children[1].className = "btn";
  el.classList.add(status === "Present" ? "present" : "absent");

  fetch(URL, {
    method: "POST",
    body: JSON.stringify({
      roll: s.roll,
      name: s.name,
      status: status
    })
  })
  .then(r => r.json())
  .then(res => {
    s.attended = res.attended;
    s.total = res.total;
    document.getElementById(`stats-${i}`).innerHTML =
      `${res.attended}/${res.total} (${res.percent}%)`;
  });
}
</script>

</body>
</html>
